<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carla López Vila — Game Artist</title>
  <meta name="description" content="Portfolio of Carla López Vila: 3D characters, creatures, environments and 2D pixel art for video games.">
  <meta property="og:title" content="Carla López Vila — Game Artist">
  <meta property="og:description" content="3D characters, creatures, environments and 2D pixel art for video games.">
  <meta property="og:image" content="media/og.jpg">
  <link rel="icon" href="media/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" data-artist-name></a>
    <nav class="nav" data-nav></nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow" data-artist-role></p>
        <h1 data-artist-name></h1>
        <p class="hero-intro" data-artist-intro></p>
        <p class="hero-edu" data-artist-education></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#characters">View work</a>
          <a class="btn" href="#contact">Contact</a>
        </div>
      </div>
      <div class="hero-art"><img data-hero-image alt="" fetchpriority="high"></div>
    </section>

    <div data-sections></div>

    <section class="contact" id="contact">
      <h2>Let's talk</h2>
      <a class="btn btn-primary" data-artist-email></a>
      <ul class="links" data-artist-links></ul>
    </section>
  </main>

  <footer class="footer"><span data-artist-name></span> · <span data-year></span></footer>

  <script src="content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
